[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-trading-bot"
version = "0.1.0"
description = "Automated Polymarket market-data, backtesting, and execution application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "polymarket-client>=0.18.0,<0.19",
  "websockets>=15.0,<17",
  "aiohttp>=3.11,<4",
  "requests>=2.32,<3",
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8",
]
notebooks = [
  "jupyter>=1.1,<2",
  "notebook>=7.3,<8",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
